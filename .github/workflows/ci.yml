name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m py_compile backend/app/*.py ai_workers/*.py cnn_service/*.py
      - run: |
          pip install fastapi pyjwt pyyaml pytest
          cd backend && python -m pytest -q tests

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml config -q
        env: { POSTGRES_PASSWORD: x, JWT_SECRET: x, MINIO_ROOT_USER: x, MINIO_ROOT_PASSWORD: xxxxxxxx, DEMO_ADMIN_PASSWORD: x }
