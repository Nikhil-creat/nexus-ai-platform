name: refine-nexus-ai

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://nexus:${POSTGRES_PASSWORD}@postgres:5432/nexus
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET}
  DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD}
  LITELLM_MODEL: ${LITELLM_MODEL:-gpt-4o-mini}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  MINIO_ENDPOINT: minio:9000
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  CNN_SERVICE_URL: http://cnn:8100
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}

services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: ["./infra/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [frontend, backend]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
    expose: ["3000"]
    restart: unless-stopped

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment: *backend-env
    expose: ["8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: celery -A app.worker.celery_app worker -l info -c 2
    environment: *backend-env
    depends_on: [backend, redis]
    restart: unless-stopped
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  cnn:
    build: ./cnn_service
    expose: ["8100"]
    volumes: ["cnn_weights:/weights"]
    restart: unless-stopped
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nexus
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: ["minio_data:/data"]
    ports: ["127.0.0.1:9001:9001"]
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  minio_data:
  cnn_weights:
